name: Validate BayesSoft release candidate

on:
  push:
    branches: ["feature/bayessoft-3.0-plus"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/feature/bayessoft-3.0-plus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://bayessoft.com.tr
      NEXT_PUBLIC_CONTACT_EMAIL: info@bayessoft.com.tr
      NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL || 'https://api.bayessoft.com.tr/api/v1/contact' }}
      NEXT_PUBLIC_GITHUB_URL: https://github.com/bayessoft2024
      NEXT_PUBLIC_LINKEDIN_URL: https://linkedin.com/company/bayessoft
      NEXT_PUBLIC_X_URL: https://x.com/bayessoft
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint release sources
        run: npx --no-install eslint app/page.tsx app/layout.tsx components/SiteChrome.tsx components/LanguageProvider.tsx components/homepage data/homepage.ts data/i18n.ts data/selectedProjects.ts lib/homepage scripts
      - name: Check translations, project data and isolation fixtures
        run: node scripts/check-foundation.mjs
      - name: Build isolated production site
        run: npm run build
      - name: Verify production export
        run: npm run verify:production
      - name: Check production routes and denied prototype URLs
        run: node scripts/check-production-access.mjs --production-only
